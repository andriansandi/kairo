name: CI

on:
  pull_request:
  push:
    branches: [main]

# NOTE: Deployment is NOT handled by this workflow.
# Cloudflare Workers Builds (Git integration) pulls this repo directly and
# builds + deploys on every push to main — see README "Deployment".

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @kairo/web build
